name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [tests, pylint, mypy]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MariaDB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libmariadb-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pylint mypy

      - name: Run unit tests
        if: matrix.check == 'tests'
        run: python -m unittest discover -s snmptt_connector/tests -v

      - name: Run Pylint
        if: matrix.check == 'pylint'
        run: python -m pylint snmptt_connector/cacti_snmptt.py snmptt_connector/tests/test_connector.py

      - name: Run mypy
        if: matrix.check == 'mypy'
        run: python -m mypy snmptt_connector/cacti_snmptt.py snmptt_connector/tests/test_connector.py
