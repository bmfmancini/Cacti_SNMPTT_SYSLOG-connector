# Adjust the Python interpreter and connector path in every EXEC line.
# Example deployment: repository at /opt/Cacti_SNMPTT_SYSLOG-connector.
# Facility 16 = local0; priority 6 = informational, 4 = warning.

EVENT coldStart .1.3.6.1.6.3.1.1.5.1 "Status Events" Normal
FORMAT Agent cold start reported by $aA
EXEC /usr/bin/python3 /opt/Cacti_SNMPTT_SYSLOG-connector/snmptt_connector/cacti_snmptt.py --hostname "$aA" --alert "$Fz" --facility 16 --priority 6
SDESC
The agent reports a cold start.
EDESC

EVENT warmStart .1.3.6.1.6.3.1.1.5.2 "Status Events" Normal
FORMAT Agent warm start reported by $aA
EXEC /usr/bin/python3 /opt/Cacti_SNMPTT_SYSLOG-connector/snmptt_connector/cacti_snmptt.py --hostname "$aA" --alert "$Fz" --facility 16 --priority 6
SDESC
The agent reports a warm start.
EDESC

EVENT linkDown .1.3.6.1.6.3.1.1.5.3 "Status Events" Warning
FORMAT Interface $1 down on $aA; admin status=$2; operational status=$3
EXEC /usr/bin/python3 /opt/Cacti_SNMPTT_SYSLOG-connector/snmptt_connector/cacti_snmptt.py --hostname "$aA" --alert "$Fz" --facility 16 --priority 4
SDESC
The interface reports a link-down transition.
EDESC

EVENT linkUp .1.3.6.1.6.3.1.1.5.4 "Status Events" Normal
FORMAT Interface $1 up on $aA; admin status=$2; operational status=$3
EXEC /usr/bin/python3 /opt/Cacti_SNMPTT_SYSLOG-connector/snmptt_connector/cacti_snmptt.py --hostname "$aA" --alert "$Fz" --facility 16 --priority 6
SDESC
The interface reports a link-up transition.
EDESC
